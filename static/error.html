        <!-- Script: initializer.js -->
        <script>
            (() => {
                const features = new Map();

                window.nercone = {
                    features,

                    register(name, hooks) {
                        const feature = { init: null, reinit: null, cleanup: null, ...hooks };
                        features.set(name, feature);
                        feature.init?.();
                        return feature;
                    },

                    cleanup()   { for (const feature of features.values()) feature.cleanup?.(); },
                    reinit(doc) { for (const feature of features.values()) feature.reinit?.(doc); }
                };
            })();
        </script>

        <!-- Script: loading-overlay.js -->
        <script>
            (() => {
                class LoadingOverlay {
                    static EASE = 'cubic-bezier(0.125,1,0.25,1)';
                    static PHASE = {
                        in:   3000,
                        wait: 1000,
                        out:  1000
                    };

                    init() {
                        const overlay = document.getElementById('loading-overlay');
                        if (!overlay) return;

                        const svg = overlay.querySelector('svg');
                        const line = overlay.querySelector('polyline');
                        if (!svg || !line) { overlay.remove(); return; }

                        const length = line.getTotalLength();
                        line.style.strokeDasharray = length;
                        line.style.strokeDashoffset = length;

                        const opts = (d) => ({ duration: d, easing: LoadingOverlay.EASE, fill: 'forwards' });

                        svg.animate([
                            { opacity: 0, transform: 'scale(1)',   filter: 'blur(20px)' },
                            { opacity: 1, transform: 'scale(0.5)', filter: 'blur(0px)'  }
                        ], opts(LoadingOverlay.PHASE.in));
                        line.animate([
                            { strokeDashoffset: length },
                            { strokeDashoffset: 0 }
                        ], opts(LoadingOverlay.PHASE.in));

                        setTimeout(() => {
                            svg.animate([
                                { opacity: 1, transform: 'scale(0.5)',  filter: 'blur(0px)'  },
                                { opacity: 0, transform: 'scale(0.75)', filter: 'blur(20px)' }
                            ], opts(LoadingOverlay.PHASE.out));

                            line.animate([
                                { strokeDashoffset: 0 },
                                { strokeDashoffset: length }
                            ], opts(LoadingOverlay.PHASE.out));

                            overlay.animate([
                                { opacity: 1, backdropFilter: 'blur(40px)', WebkitBackdropFilter: 'blur(40px)' },
                                { opacity: 0, backdropFilter: 'blur(0px)',  WebkitBackdropFilter: 'blur(0px)'  }
                            ], opts(LoadingOverlay.PHASE.out));

                            setTimeout(() => overlay.remove(), LoadingOverlay.PHASE.out);
                        }, LoadingOverlay.PHASE.in + LoadingOverlay.PHASE.wait);
                    }
                }

                const loadingOverlay = new LoadingOverlay();
                window.nercone.register('loading-overlay', { init: () => loadingOverlay.init() });
            })();
        </script>

        <!-- Script: view-transition.js -->
        <script>
            (() => {
                if (!document.startViewTransition) return;

                let abortController = null;

                function preloadAssets(newDoc) {
                    const curStyleHrefs = new Set([...document.querySelectorAll('link[rel="stylesheet"]')].map(l => l.href));
                    const curScriptSrcs = new Set([...document.querySelectorAll('script[src]')].map(s => s.src));

                    const tasks = [];

                    const newStyles = [
                        ...newDoc.head.querySelectorAll('link[rel="stylesheet"]'),
                        ...newDoc.body.querySelectorAll(':scope > link[rel="stylesheet"]'),
                    ];
                    newStyles
                        .filter(l => !curStyleHrefs.has(new URL(l.href, location.href).href))
                        .forEach(link => tasks.push(new Promise(resolve => {
                            const l = link.cloneNode(true);
                            l.addEventListener('load',  resolve, { once: true });
                            l.addEventListener('error', resolve, { once: true });
                            document.head.appendChild(l);
                        })));

                    const newScriptEls = [
                        ...newDoc.head.querySelectorAll('script[src]'),
                        ...newDoc.body.querySelectorAll(':scope > script[src]'),
                    ].filter(s => !curScriptSrcs.has(new URL(s.src, location.href).href));

                    newScriptEls.forEach(script => tasks.push(new Promise(resolve => {
                        const l = document.createElement('link');
                        l.rel = 'preload';
                        l.as = 'script';
                        l.href = new URL(script.getAttribute('src'), location.href).href;
                        l.addEventListener('load',  resolve, { once: true });
                        l.addEventListener('error', resolve, { once: true });
                        document.head.appendChild(l);
                    })));

                    return Promise.all(tasks).then(() => newScriptEls);
                }

                function updateHead(newDoc) {
                    const head = document.head;
                    const newHead = newDoc.head;

                    const t = newHead.querySelector('title');
                    if (t) document.title = t.textContent;

                    const META_KEEP = new Set(['charset', 'viewport', 'color-scheme', 'theme-color']);
                    head.querySelectorAll('meta').forEach((m) => {
                        const key = m.getAttribute('name') || m.getAttribute('property');
                        if (!key || META_KEEP.has(key)) return;
                        m.remove();
                    });
                    const insertRef = head.querySelector(
                        'link[rel="preconnect"], link[rel="stylesheet"], link[rel="manifest"], link[rel="icon"], script'
                    );
                    newHead.querySelectorAll('meta[name], meta[property]').forEach((m) => {
                        const key = m.getAttribute('name') || m.getAttribute('property');
                        if (!META_KEEP.has(key)) head.insertBefore(m.cloneNode(true), insertRef);
                    });

                    const nc = newHead.querySelector('link[rel="canonical"]');
                    const cc = head.querySelector('link[rel="canonical"]');
                    if (nc && cc) cc.href = nc.href;

                    const newStyleHrefs = new Set([
                        ...newHead.querySelectorAll('link[rel="stylesheet"]'),
                        ...newDoc.body.querySelectorAll(':scope > link[rel="stylesheet"]'),
                    ].map(l => new URL(l.href, location.href).href));
                    head.querySelectorAll('link[rel="stylesheet"]').forEach((l) => {
                        if (!newStyleHrefs.has(l.href)) l.remove();
                    });
                    document.body.querySelectorAll(':scope > link[rel="stylesheet"]').forEach((l) => {
                        if (!newStyleHrefs.has(l.href)) l.remove();
                    });

                    const newScriptSrcs = new Set([
                        ...newHead.querySelectorAll('script[src]'),
                        ...newDoc.body.querySelectorAll(':scope > script[src]'),
                    ].map(s => new URL(s.src, location.href).href));
                    head.querySelectorAll('script[src]').forEach((s) => {
                        if (!newScriptSrcs.has(s.src)) s.remove();
                    });
                    document.body.querySelectorAll(':scope > script[src]').forEach((s) => {
                        if (!newScriptSrcs.has(s.src)) s.remove();
                    });

                    head.querySelectorAll('style').forEach(s => s.remove());
                    newHead.querySelectorAll('style').forEach(s => head.appendChild(s.cloneNode(true)));
                }

                async function navigate(url, pushHistory = true) {
                    if (abortController) abortController.abort();
                    const ac = new AbortController();
                    abortController = ac;

                    document.startViewTransition(async () => {
                        // Fetch
                        let response;
                        try {
                            response = await fetch(url.href, {
                                headers: { 'X-Requested-With': 'view-transition' },
                                signal: ac.signal
                            });
                        } catch (err) {
                            if (err.name === 'AbortError') return;
                            location.href = url.href;
                            return;
                        }

                        if (ac.signal.aborted) return;

                        const html = await response.text();
                        const doc = new DOMParser().parseFromString(html, 'text/html');

                        // Cleanup
                        window.nercone.cleanup();

                        // Head
                        const deferredScripts = await preloadAssets(doc);
                        updateHead(doc);

                        // Swap
                        for (const tag of ['header', 'main']) {
                            const newEl = doc.querySelector(tag);
                            const curEl = document.querySelector(tag);

                            if (!newEl || !curEl) {
                                location.href = url.href; return;
                            }

                            [...curEl.attributes].forEach(a => curEl.removeAttribute(a.name));
                            [...newEl.attributes].forEach(a => curEl.setAttribute(a.name, a.value));

                            curEl.innerHTML = newEl.innerHTML;

                            curEl.querySelectorAll('script').forEach((old) => {
                                const s = document.createElement('script');
                                [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
                                s.textContent = old.textContent;
                                old.replaceWith(s);
                            });
                        }

                        // Deferred scripts
                        deferredScripts.forEach((script) => {
                            const s = document.createElement('script');
                            [...script.attributes].forEach(a => s.setAttribute(a.name, a.value));
                            document.head.appendChild(s);
                        });

                        if (pushHistory) history.pushState(null, '', response.url);

                        // Reinit
                        window.nercone.reinit(doc);
                    });
                }

                window.nercone.navigate = (href) => {
                    let url;
                    try { url = new URL(href, location.href); } catch (_) { location.href = href; return; }
                    if (url.origin !== location.origin) { location.href = href; return; }
                    navigate(url);
                };

                document.addEventListener('click', (event) => {
                    const link = event.target.closest('a');
                    if (!link || link.hasAttribute('download')) return;

                    const url = new URL(link.href, location.href);
                    if (url.origin !== location.origin) return;
                    if (link.target || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

                    if (url.hash && url.pathname === location.pathname) {
                        event.preventDefault();
                        const target = document.querySelector(url.hash);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            history.pushState(null, '', url.hash);
                        }
                        return;
                    }

                    event.preventDefault();
                    navigate(url);
                });

                window.addEventListener('popstate', () => navigate(new URL(location.href), false));
            })();
        </script>

        <!-- Script: cursor.js -->
        <script>
            (() => {
                class Cursor {
                    static LINK_SELECTORS = 'a, button, [role="button"], input[type="submit"], input[type="button"]';
                    static PADDING = 6;
                    static TOUCH_MOUSE_GUARD_MS = 800;
                    static TEXT_GAP_PX = 4;
                    static LINK_GAP_PX = 4;

                    constructor() {
                        this.ac = null;
                        this.mouseX = 0;
                        this.mouseY = 0;
                        this.currentLinkEl = null;
                        this.rafId = null;
                        this.cursor = null;
                        this.cursorVisible = false;
                        this.lastTouchTime = 0;
                        this.isMouseDown = false;

                        document.documentElement.style.cursor = 'none';
                    }

                    // Visibility
                    showCursor() {
                        if (!this.cursorVisible && this.cursor) {
                            this.cursorVisible = true;
                            this.cursor.classList.add('visible');
                        }
                    }

                    hideCursor() {
                        if (this.cursor) {
                            this.cursorVisible = false;
                            this.cursor.style.borderRadius = '';
                            this.cursor.classList.remove('visible');
                            this.currentLinkEl = null;
                            if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
                            this.cursor.classList.remove('on-link', 'on-text');
                        }
                    }

                    isSyntheticMouse() {
                        return Date.now() - this.lastTouchTime < Cursor.TOUCH_MOUSE_GUARD_MS;
                    }

                    // Helpers
                    findNearbyLink(x, y) {
                        const el = document.elementFromPoint(x, y);
                        const exact = el ? el.closest(Cursor.LINK_SELECTORS) : null;
                        if (exact) return exact;

                        let best = null;
                        let bestDist = Infinity;
                        for (const link of document.querySelectorAll(Cursor.LINK_SELECTORS)) {
                            const r = link.getBoundingClientRect();
                            const dx = Math.max(0, r.left - x, x - r.right);
                            const dy = Math.max(0, r.top  - y, y - r.bottom);
                            const dist = Math.max(dx, dy);
                            if (dist <= Cursor.LINK_GAP_PX && dist < bestDist) {
                                bestDist = dist;
                                best = link;
                            }
                        }
                        return best;
                    }

                    isOverRenderedText(x, y) {
                        let node, offset;
                        if (document.caretPositionFromPoint) {
                            const pos = document.caretPositionFromPoint(x, y);
                            if (!pos || pos.offsetNode.nodeType !== Node.TEXT_NODE) return false;
                            node = pos.offsetNode;
                            offset = pos.offset;
                        } else if (document.caretRangeFromPoint) {
                            const r = document.caretRangeFromPoint(x, y);
                            if (!r || r.startContainer.nodeType !== Node.TEXT_NODE) return false;
                            node = r.startContainer;
                            offset = r.startOffset;
                        } else {
                            return false;
                        }

                        const range = document.createRange();
                        const candidates = [];
                        if (offset < node.length) candidates.push([offset, offset + 1]);
                        if (offset > 0)           candidates.push([offset - 1, offset]);
                        if (candidates.length === 0) return false;

                        const gap = Cursor.TEXT_GAP_PX;
                        for (const [s, e] of candidates) {
                            range.setStart(node, s);
                            range.setEnd(node, e);
                            for (const rect of range.getClientRects()) {
                                if (x >= rect.left - gap && x <= rect.right  + gap &&
                                    y >= rect.top  - gap && y <= rect.bottom + gap) return true;
                            }
                        }
                        return false;
                    }

                    // Rendering
                    updateCursorForLink(el) {
                        const PADDING = Cursor.PADDING;
                        let rect = el.getBoundingClientRect();

                        if (getComputedStyle(el).display === 'inline') {
                            const descendants = el.querySelectorAll('*');
                            if (descendants.length > 0) {
                                const rects = [...descendants].map(c => c.getBoundingClientRect());
                                const left   = Math.min(...rects.map(r => r.left));
                                const top    = Math.min(...rects.map(r => r.top));
                                const right  = Math.max(...rects.map(r => r.right));
                                const bottom = Math.max(...rects.map(r => r.bottom));
                                rect = { left, top, width: right - left, height: bottom - top };
                            }
                        }

                        this.cursor.classList.remove('on-text');
                        this.cursor.classList.add('on-link');
                        this.cursor.style.transform = 'none';
                        this.cursor.style.left   = (rect.left - PADDING) + 'px';
                        this.cursor.style.top    = (rect.top  - PADDING) + 'px';
                        this.cursor.style.width  = (rect.width  + PADDING * 2) + 'px';
                        this.cursor.style.height = (rect.height + PADDING * 2) + 'px';

                        function parseRadius(val, wRef) {
                            if (!val) return 0;
                            const first = val.trim().split(' ')[0];
                            return first.endsWith('%') ? parseFloat(first) / 100 * wRef : (parseFloat(first) || 0);
                        }

                        function resolveRadiusSource(el, wRef) {
                            const PROPS = ['borderTopLeftRadius', 'borderTopRightRadius', 'borderBottomRightRadius', 'borderBottomLeftRadius'];
                            for (const target of [el, ...el.children]) {
                                const cs = getComputedStyle(target);
                                if (PROPS.some(p => parseRadius(cs[p], wRef) > 0)) return cs;
                            }
                            return getComputedStyle(el);
                        }

                        const w = rect.width;
                        const cs = resolveRadiusSource(el, w);
                        this.cursor.style.borderRadius = [
                            cs.borderTopLeftRadius,
                            cs.borderTopRightRadius,
                            cs.borderBottomRightRadius,
                            cs.borderBottomLeftRadius,
                        ].map(v => `${parseRadius(v, w) + PADDING}px`).join(' ');
                    }

                    trackLink = () => {
                        if (this.currentLinkEl) {
                            this.updateCursorForLink(this.currentLinkEl);
                            this.rafId = requestAnimationFrame(this.trackLink);
                        }
                    };

                    // Lifecycle
                    init() {
                        this.ac = new AbortController();
                        const signal = this.ac.signal;

                        this.cursor = document.getElementById('cursor');
                        if (!this.cursor) return;

                        document.addEventListener('touchstart', () => { this.lastTouchTime = Date.now(); this.hideCursor(); }, { passive: true, signal });
                        document.addEventListener('touchmove',  () => { this.lastTouchTime = Date.now(); this.hideCursor(); }, { passive: true, signal });
                        document.addEventListener('touchend',   () => { this.lastTouchTime = Date.now(); },                   { passive: true, signal });

                        document.addEventListener('mouseover', (e) => { if (e.target.tagName === 'IFRAME' || e.target.closest('.cursor-system')) this.hideCursor(); }, { signal });

                        document.addEventListener('mousemove', (e) => {
                            if (this.isSyntheticMouse()) return;
                            if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;

                            if (e.target.closest('.cursor-system')) { this.hideCursor(); return; }

                            this.mouseX = e.clientX;
                            this.mouseY = e.clientY;

                            this.showCursor();

                            const linkEl = this.findNearbyLink(this.mouseX, this.mouseY);

                            if (linkEl) {
                                if (this.currentLinkEl !== linkEl) {
                                    this.currentLinkEl = linkEl;
                                    if (this.rafId) cancelAnimationFrame(this.rafId);
                                    this.rafId = requestAnimationFrame(this.trackLink);
                                }
                            } else {
                                if (this.currentLinkEl) {
                                    this.currentLinkEl = null;
                                    if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
                                }
                                this.cursor.classList.remove('on-link');
                                this.cursor.style.transform = this.isMouseDown ? 'translate(-50%, -50%) scale(0.9)' : 'translate(-50%, -50%)';
                                this.cursor.style.borderRadius = '';
                                this.cursor.style.left = this.mouseX + 'px';
                                this.cursor.style.top  = this.mouseY + 'px';
                                this.cursor.style.width = '';
                                this.cursor.style.height = '';

                                if (this.isOverRenderedText(this.mouseX, this.mouseY)) {
                                    this.cursor.classList.add('on-text');
                                } else {
                                    this.cursor.classList.remove('on-text');
                                }
                            }
                        }, { signal });

                        document.addEventListener('mousedown', () => {
                            this.isMouseDown = true;
                            this.cursor.style.transform = this.currentLinkEl ? 'none' : 'translate(-50%, -50%) scale(0.9)';
                        }, { signal });
                        document.addEventListener('mouseup', () => {
                            this.isMouseDown = false;
                            this.cursor.style.transform = this.currentLinkEl ? 'none' : 'translate(-50%, -50%) scale(1)';
                        }, { signal });

                        window.addEventListener('scroll', () => {
                            if (this.currentLinkEl) this.updateCursorForLink(this.currentLinkEl);
                        }, { passive: true, signal });
                    }

                    cleanup() {
                        if (this.ac) this.ac.abort();
                        if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
                        document.documentElement.style.cursor = '';
                        this.currentLinkEl = null;
                    }

                    reinit() {
                        this.cursor = document.getElementById('cursor');
                        if (!this.cursor) return;

                        this.currentLinkEl = null;

                        if (this.rafId) {
                            cancelAnimationFrame(this.rafId); this.rafId = null;
                        }

                        this.cursor.classList.remove('on-link', 'on-text');
                        this.cursor.style.transform = 'translate(-50%, -50%)';
                        this.cursor.style.borderRadius = '';
                        this.cursor.style.left = this.mouseX + 'px';
                        this.cursor.style.top  = this.mouseY + 'px';
                        this.cursor.style.width = '';
                        this.cursor.style.height = '';

                        const newLinkEl = this.findNearbyLink(this.mouseX, this.mouseY);
                        if (newLinkEl) {
                            this.currentLinkEl = newLinkEl;
                            this.rafId = requestAnimationFrame(this.trackLink);
                        } else if (this.isOverRenderedText(this.mouseX, this.mouseY)) {
                            this.cursor.classList.add('on-text');
                        }

                        this.init();
                    }
                }

                const cursor = new Cursor();
                window.nercone.register('cursor', {
                    init:    () => cursor.init(),
                    cleanup: () => cursor.cleanup(),
                    reinit:  () => cursor.reinit()
                });
            })();
        </script>

        <!-- Script: class-prefix.js -->
        <script>
            (() => {
                class ClassPrefix {
                    static CONFIG = [
                        { prefix: 'small',  media: '(max-width: 768px)' },
                        { prefix: 'medium', media: '(min-width: 769px) and (max-width: 1080px)' },
                        { prefix: 'large',  media: '(min-width: 1081px)' }
                    ];

                    constructor(config = ClassPrefixManager.CONFIG) {
                        this.config = config;
                        this.prefixes = config.map(e => e.prefix);
                        this.selector = this.prefixes.map(p => `[class*="${p}:"]`).join(',');
                        this.resolvers = new Map();
                        this.unsubscribers = [];
                        this.bodyObserver = null;
                    }

                    buildResolvers() {
                        for (const entry of this.config) {
                            if (entry.media) {
                                const mq = window.matchMedia(entry.media);
                                this.resolvers.set(entry.prefix, () => mq.matches);
                                const h = () => this.applyAll();
                                mq.addEventListener('change', h);
                                this.unsubscribers.push(() => mq.removeEventListener('change', h));

                            } else if (entry.attr) {
                                const { selector, name: attrName, value: attrValue } = entry.attr;
                                const target = document.querySelector(selector) || document.documentElement;
                                this.resolvers.set(entry.prefix, () => target.getAttribute(attrName) === attrValue);
                                const obs = new MutationObserver(() => this.applyAll());
                                obs.observe(target, { attributes: true, attributeFilter: [attrName] });
                                this.unsubscribers.push(() => obs.disconnect());

                            } else if (entry.fn) {
                                this.resolvers.set(entry.prefix, entry.fn);
                            }
                        }
                    }

                    applyToElement(el) {
                        if (!(el instanceof Element)) return;
                        for (const cls of el.classList) {
                            const i = cls.indexOf(':');
                            if (i === -1) continue;

                            const resolver = this.resolvers.get(cls.slice(0, i));
                            if (!resolver) continue;

                            const name = cls.slice(i + 1);
                            if (!name) continue;

                            el.classList.toggle(name, resolver());
                        }
                    }

                    applyToSubtree(root) {
                        if (root instanceof Element) this.applyToElement(root);
                        if (root.querySelectorAll) {
                            root.querySelectorAll(this.selector).forEach(el => this.applyToElement(el));
                        }
                    }

                    applyAll() {
                        if (document.body) this.applyToSubtree(document.body);
                    }

                    init() {
                        this.buildResolvers();

                        this.bodyObserver = new MutationObserver((mutations) => {
                            for (const m of mutations) {
                                if (m.type === 'childList') {
                                    for (const node of m.addedNodes) this.applyToSubtree(node);

                                } else if (m.type === 'attributes') {
                                    const el = m.target;
                                    const oldSet = new Set((m.oldValue || '').split(/\s+/).filter(Boolean));

                                    let hasNew = false;
                                    for (const cls of el.classList) {
                                        const idx = cls.indexOf(':');
                                        if (idx !== -1 && this.resolvers.has(cls.slice(0, idx)) && !oldSet.has(cls)) {
                                            hasNew = true;
                                            break;
                                        }
                                    }

                                    if (hasNew) this.applyToElement(el);
                                }
                            }
                        });

                        this.bodyObserver.observe(document.body, {
                            childList: true,
                            subtree: true,
                            attributes: true,
                            attributeFilter: ['class'],
                            attributeOldValue: true
                        });

                        this.applyAll();
                    }
                }

                const responsive = new ClassPrefix(window.nercone.responsiveConfig || ClassPrefix.CONFIG);
                window.nercone.register('responsive', { init: () => responsive.init() });
            })();
        </script>

        <!-- Script: components/dropdown.js -->
        <script>
            (() => {
                class Dropdown {
                    static CHEVRON_DOWN = '6 9 12 15 18 9';
                    static CHEVRON_UP   = '6 15 12 9 18 15';

                    constructor() {
                        document.addEventListener('click', (e) => {
                            const toggle = e.target.closest('.dropdown > button');
                            if (toggle) {
                                const dropdown = toggle.closest('.dropdown');
                                dropdown.classList.toggle('is-open');
                                this.setChevron(toggle, dropdown.classList.contains('is-open'));
                                return;
                            }
                            document.querySelectorAll('.dropdown.is-open').forEach((d) => {
                                if (!d.contains(e.target)) {
                                    d.classList.remove('is-open');
                                    const btn = d.querySelector(':scope > button');
                                    if (btn) this.setChevron(btn, false);
                                }
                            });
                        });
                    }

                    createChevron() {
                        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.setAttribute('viewBox', '0 0 24 24');
                        svg.setAttribute('width', '12');
                        svg.setAttribute('height', '12');
                        svg.setAttribute('fill', 'none');
                        svg.setAttribute('stroke', 'currentColor');
                        svg.setAttribute('stroke-width', '2');
                        svg.setAttribute('stroke-linecap', 'round');
                        svg.setAttribute('stroke-linejoin', 'round');
                        svg.classList.add('dropdown-chevron');
                        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                        poly.setAttribute('points', Dropdown.CHEVRON_DOWN);
                        svg.appendChild(poly);
                        return svg;
                    }

                    setChevron(btn, isOpen) {
                        const poly = btn.querySelector('.dropdown-chevron polyline');
                        if (poly) poly.setAttribute('points', isOpen ? Dropdown.CHEVRON_UP : Dropdown.CHEVRON_DOWN);
                    }

                    init() {
                        document.querySelectorAll('.dropdown > button').forEach((btn) => {
                            if (btn.dataset.dropdownInit) return;
                            btn.dataset.dropdownInit = '1';
                            if (!btn.querySelector('.dropdown-chevron')) btn.appendChild(this.createChevron());
                        });
                    }
                }

                const dropdown = new Dropdown();
                window.nercone.register('dropdown', {
                    init:   () => dropdown.init(),
                    reinit: () => dropdown.init()
                });
            })();
        </script>

        <!-- Script: components/snowflake-toast.js -->
        <script>
            (() => {
                class SnowflakeToast {
                    init() {
                        const toast = document.getElementById('snowflake-toast');
                        if (!toast || toast.dataset.snowflakeToastInit) return;
                        toast.dataset.snowflakeToastInit = '1';

                        const closeButton = toast.querySelector('.snowflake-toast-close');
                        if (closeButton) {
                            closeButton.addEventListener('click', () => toast.classList.add('is-hidden'));
                        }

                        const minimizeButton = toast.querySelector('.snowflake-toast-minimize');
                        if (minimizeButton) {
                            const setMinimized = (minimized) => {
                                toast.classList.toggle('is-minimized', minimized);
                                minimizeButton.setAttribute('aria-pressed', minimized ? 'true' : 'false');
                                minimizeButton.setAttribute('aria-label', minimized ? '表示' : '非表示');
                            };
                            minimizeButton.addEventListener('click', () => setMinimized(!toast.classList.contains('is-minimized')));
                        }
                    }
                }

                const snowflakeToast = new SnowflakeToast();
                window.nercone.register('snowflake-toast', { init: () => snowflakeToast.init() });
            })();
        </script>

            .font-variant-ligatures-normal {
                font-variant-ligatures: normal;
            }
            .font-variant-ligatures-none {
                font-variant-ligatures: none;
            }
            .font-variant-ligatures-contextual {
                font-variant-ligatures: contextual;
            }
            .font-variant-ligatures-no-contextual {
                font-variant-ligatures: no-contextual;
            }
            .font-variant-ligatures-common {

            }
            .font-variant-ligatures-no-common {

            .font-variant-ligatures-discretionary {

            }

            .font-variant-ligatures-historical {

            }
            .font-variant-ligatures-no-historical {

            .font-variant-numeric-normal {

            }
            .font-variant-numeric-ordinal {

            }
            .font-variant-numeric-slashed-zero {
                font-variant-numeric: slashed-zero;
            }
            .font-variant-numeric-lining {
                font-variant-numeric: lining-nums;
            }
            .font-variant-numeric-oldstyle {
                font-variant-numeric: oldstyle-nums;
            }
            .font-variant-numeric-proportional {
                font-variant-numeric: proportional-nums;
            }
            .font-variant-numeric-tabular {

            }
            .font-variant-numeric-diagonal-fractions {
                font-variant-numeric: diagonal-fractions;
            }
            .font-variant-numeric-stacked-fractions {

            }

            .font-variant-position-normal {

            }
            .font-variant-position-sub {
                font-variant-position: sub;
            }
            .font-variant-position-super {
                font-variant-position: super;
            }

            .font-variant-historical-forms {
                font-variant-alternates: historical-forms;
            }

            .text-no-decoration {
                text-decoration: none;
            }
            .text-italic {
                font-style: italic;
            }
            .text-underline {
                text-decoration: underline;
            }
            .text-overline {
                text-decoration: overline;
            }
            .text-line-through {
                text-decoration: line-through;
            }

            .font-xx-small {
                font-size: xx-small;
            }
            .font-x-small {
                font-size: x-small;
            }
            .font-small {

            }
            .font-medium {
                font-size: medium;
            }
            .font-large {
                font-size: large;
            }
            .font-x-large {
                font-size: x-large;
            }
            .font-xx-large {
                font-size: xx-large;
            }
            .font-xxx-large {
                font-size: xxx-large;
            }
            .font-smaller {
                font-size: smaller;
            }
            .font-larger {
                font-size: larger;
            }
        </style>

        <!-- Stylesheet: cursor.css -->
        <style>
            * {
                cursor: none;
            }

            .cursor-system, .cursor-system * {
                cursor: auto;
            }

            #cursor {
                view-transition-name: cursor;

                background: var(--theme-color-background-cursor);

                opacity: 0;

                border-radius: 50%;

                position: fixed;
                z-index: 99999;
                width: 25px;
                height: 25px;

                pointer-events: none;

                transform: translate(-50%, -50%);
                transition:
                    transform     0.075s ease-out,
                    left          0.075s ease-out,
                    top           0.075s ease-out,
                    width         0.15s cubic-bezier(0.125,1,0.25,1),
                    height        0.15s cubic-bezier(0.125,1,0.25,1),
                    border-radius 0.15s cubic-bezier(0.125,1,0.25,1),
                    background    0.15s ease,
                    opacity       0.25s ease;
            }

            #cursor.visible {
                opacity: 1;
            }

            #cursor.on-text {
                width: 3px;
                border-radius: 1.5px;
            }
            #cursor.on-link {
                background: var(--theme-color-background-cursor-on-link);
                transform: translate(0, 0);
            }
        </style>

        <!-- Stylesheet: layout.css -->
        <style>
            section {
                padding-top: 4px;
                padding-bottom: 4px;
            }

            blockquote {
                border-left: solid 4px var(--theme-color-background-alt);
                padding-left: 8px;
                margin: 0 0 16px 0;
            }

            .hero {
                background-color: color-mix(in srgb, var(--theme-color-background) 90%, var(--theme-color-stark));

                position: relative;
                overflow: hidden;

                display: flex;
                flex-direction: column;
                justify-content: flex-end;

                box-sizing: border-box;

                width: 100vw;
                height: 40vh;

                margin: 0;
                margin-left: calc(50% - 50vw);

                padding: 24px;
            }
            .hero::before {
                content: "";
                position: absolute;
                inset: 0px;

                background-image: var(--hero-image, none);
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;

                mask-image: linear-gradient(to bottom, black, rgba(0,0,0,0.2));
                filter: brightness(0.8) blur(1px);
            }
            main > .hero {
                margin-top: -24px;
            }
            .hero > * {
                position: relative;
                margin: 0;
            }
            .hero > h1 {
                padding-bottom: 0;
                border-bottom: none;
            }
            .hero > p {
                color: var(--theme-color-text-alt);
            }

            .flex {
                display: flex;
                align-items: center;
                gap: 16px;
            }
            .flex > * {
                margin: 0;
            }
            .flex-1 {
                flex: 1;
            }
            .flex-vertical {
                flex-direction: column;
            }
            .flex-wrap {
                flex-wrap: wrap;
            }

            .block {
                position: relative;
                border: solid 1px var(--theme-color-border);

                padding: 16px;
                margin-bottom: 16px;
            }
            .block > *:first-child {
                margin-top: 0;
            }
            .block > *:last-child {
                margin-bottom: 0;
            }
            .block::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                width: 4px;
            }

            .block-note::before {
                background-color: var(--color-bright-blue);
            }
            .block-note > b:first-child {
                color: var(--color-bright-blue);
            }
            .block-tip::before {
                background-color: var(--color-bright-green);
            }
            .block-tip > b:first-child {
                color: var(--color-bright-green);
            }
            .block-important::before {
                background-color: var(--color-bright-purple);
            }
            .block-important > b:first-child {
                color: var(--color-bright-purple);
            }
            .block-warning::before {
                background-color: var(--color-bright-yellow);
            }
            .block-warning > b:first-child {
                color: var(--color-bright-yellow);
            }
            .block-caution::before {
                background-color: var(--color-bright-red);
            }
            .block-caution > b:first-child {
                color: var(--color-bright-red);
            }

            .no-top-margin {
                margin-top: 0px;
            }
            .no-bottom-margin {
                margin-bottom: 0px;
            }

            .hide {
                display: none;
            }
            .show {
                display: block;
            }

            .overflow-show {
                overflow: visible;
            }
            .overflow-hide {
                overflow: hidden;
            }
            .overflow-scroll {
                overflow: scroll;
            }

            .limited-width {
                width: none;
                margin-left: auto;
                margin-right: auto;
            }
            .limited-width > img {
                max-width: 100%;
            }
            .limited-width > img:first-child {
                margin-top: 24px;
            }
            @media (min-width: 769px) {
                .limited-width {
                    width: 75vh;
                }
            }
        </style>

        <!-- Stylesheet: miscellaneous.css -->
        <style>
            .selectable {
                user-select: auto;
                -webkit-touch-callout: default;
            }
            .unselectable {
                user-select: none;
                -webkit-touch-callout: none;
            }

            .banner {
                height: 50px;
                width: auto;
            }

            .small-icon {
                width: var(--font-size);
                height: var(--font-size);
                display: block;
            }
        </style>

        <!-- Stylesheet: components/button.css -->
        <style>
            .button {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                font-family: inherit;
                font-size: smaller;
                font-weight: 400;
                color: var(--theme-color-text);
                background-color: transparent;
                border: 1px solid var(--theme-color-text-headline-underline);
                text-decoration: none;
                transition: background-color 0.15s, color 0.15s, border-color 0.15s;
                white-space: nowrap;
                user-select: none;
                box-sizing: border-box;
            }
            .button:hover {
                background-color: color-mix(in srgb, var(--theme-color-stark) 8%, transparent);
                color: var(--theme-color-stark);
                border-color: var(--theme-color-text-alt);
            }
            .button:active {
                background-color: color-mix(in srgb, var(--theme-color-stark) 16%, transparent);
            }
            .button.is-active {
                background-color: var(--theme-color-background-alt);
                color: var(--theme-color-stark);
                border-color: var(--theme-color-text-alt);
                font-weight: 600;
            }
            .button:disabled,
            .button.is-disabled {
                opacity: 0.4;
                pointer-events: none;
            }

            .button-primary {
                color: var(--theme-color-background);
                background-color: var(--theme-color-stark);
                border-color: var(--theme-color-stark);
            }
            .button-primary:hover {
                background-color: var(--theme-color-text);
                border-color: var(--theme-color-text);
                color: var(--theme-color-background);
            }
            .button-primary:active {
                background-color: var(--theme-color-text-alt);
                border-color: var(--theme-color-text-alt);
            }

            .button-ghost {
                border-color: transparent;
            }
            .button-ghost:hover {
                border-color: transparent;
            }
            .button-ghost:active {
                border-color: transparent;
            }
        </style>

        <!-- Stylesheet: components/dropdown.css -->
        <style>
            .dropdown {
                background-color: var(--theme-color-background-dropdown);
                position: relative;
                display: inline-block;
            }

            .dropdown > button.dropdown-item {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .dropdown-chevron {
                width: 1.2em;
                height: 1.2em;
                flex-shrink: 0;
                box-sizing: content-box;
                overflow: visible;
                vertical-align: middle;
            }

            .dropdown-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                min-width: 100%;
                background-color: var(--theme-color-background);
                border: 1px solid var(--theme-color-border);
                margin-top: 2px;
                z-index: 100;
            }
            .dropdown.is-open > .dropdown-menu {
                display: block;
            }

            .dropdown-item {
                display: block;
                padding: 6px 12px;
                font-size: smaller;
                font-family: inherit;
                font-weight: 400;
                color: var(--theme-color-text);
                background: none;
                border: none;
                width: 100%;
                text-align: left;
                text-decoration: none;
                white-space: nowrap;
                box-sizing: border-box;
                transition: background-color 0.15s, color 0.15s;
            }
            .dropdown-item.is-active {
                background-color: var(--theme-color-background-dropdown-active);
                color: var(--theme-color-stark);
            }

            .dropdown-separator {
                border: none;
                border-top: 1px solid var(--theme-color-text-headline-underline);
                margin: 4px 0;
            }
        </style>

        <!-- Stylesheet: components/snowflake-toast.css -->
        <style>
            .snowflake-toast {
                view-transition-name: snowflake-toast;

                border: 1px solid var(--theme-color-border-header);

                width: 320px;
                max-width: calc(100vw - 32px);

                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 1000;
            }
            .snowflake-toast.is-hidden {
                display: none;
            }

            .snowflake-toast-header {
                font-size: smaller;

                display: flex;
                align-items: center;
                justify-content: space-between;

                gap: 6px;
                padding: 6px;
            }

            .snowflake-toast-link {
                cursor: pointer;
            }

            .snowflake-toast-actions {
                display: flex;
                align-items: center;

                gap: 2px;
                flex-shrink: 0;
            }

            .snowflake-toast-minimize,
            .snowflake-toast-close {
                background: none;

                border: none;

                display: inline-flex;
                align-items: center;
                justify-content: center;

                width: var(--font-size);
                height: var(--font-size);

                padding: 0;
                flex-shrink: 0;
            }
            .snowflake-toast-minimize, .snowflake-toast-minimize *,
            .snowflake-toast-close, .snowflake-toast-close * {
                cursor: pointer;
            }
            .snowflake-toast-minimize svg,
            .snowflake-toast-close svg {
                width: var(--font-size);
                height: var(--font-size);
            }

            .snowflake-toast-minimize-vertical {
                display: none;
            }
            .snowflake-toast.is-minimized .snowflake-toast-minimize-vertical {
                display: inline;
            }

            .snowflake-toast iframe {
                border: none;
                display: block;
                width: 320px;
                height: 262px;
                max-width: 100%;
            }
            .snowflake-toast.is-minimized iframe {
                height: 0;
                min-height: 0;
                overflow: hidden;
                pointer-events: none;
            }

            @media (max-width: 512px) {
                .snowflake-toast {
                    right: auto;
                    left: 50%;
                    transform: translateX(-50%);
                }
            }

            @media (prefers-color-scheme: light) {
                :root {
                    --color-scheme-background-snowflake: #f9f9fa;
                }
                .snowflake-toast {
                    background: var(--color-scheme-background-snowflake);
                }
                .snowflake-toast * {
                    color: #000000;
                }
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --color-scheme-background-snowflake: #38383d;
                }
                .snowflake-toast {
                    background: var(--color-scheme-background-snowflake);
                }
                .snowflake-toast * {
                    color: #ffffff;
                }
            }
        </style>

        <!-- Stylesheet: noscript.css -->
        <style>
            #loading-overlay {
                display: none;
            }
        </style>
    </body>
</html>
