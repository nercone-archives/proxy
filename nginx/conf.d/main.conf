# Proxy
upstream mail_backend {
    server 100.86.39.5:8080;
}

upstream bluesky_backend {
    server 127.0.0.1:3000;
}

upstream website_backend {
    server unix:/run/website/app.sock;
}

map $host $backend {
    ~^mx\.  mail_backend;
    default website_backend;
}

# Plaintext
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name nercone.dev       *.nercone.dev
                nerc1.dev         *.nerc1.dev
                diamondgotcat.net *.diamondgotcat.net
                d-g-c.net         *.d-g-c.net;

    return 301 https://$host$request_uri;
}

# Bluesky PDS (SSL/TLS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;

    server_name pds.nercone.dev;

    include /etc/nginx/snippets/ssl.conf;

    client_max_body_size    300m;
    proxy_request_buffering off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://bluesky_backend;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# SSL/TLS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;

    server_name nercone.dev       *.nercone.dev
                nerc1.dev         *.nerc1.dev
                diamondgotcat.net *.diamondgotcat.net
                d-g-c.net         *.d-g-c.net;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/error.conf;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        add_header   Cache-Control "max-age=3600";
        return 200 "version: STSv1\r\nmode: testing\r\nmx: mx.nercone.dev\r\nmax_age: 86400\r\n";
    }

    location ~* \.(ttf|otf|woff|woff2)$ {
        proxy_pass http://$backend;
        proxy_buffering off;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        proxy_pass http://$backend;
        include /etc/nginx/snippets/proxy.conf;
    }
}
